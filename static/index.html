<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#d03ec6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="CRM Romy">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/static/manifest.json">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&hearts;</text></svg>">
<title>CRM - Les Ami(e)s de Romy</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--pink:#d03ec6;--pink-dark:#9e2b94;--pink-light:#f3e0f5;--gray:#f5f5f5;--dark:#333;--green:#4caf50;--blue:#4e6675;--red:#f44336;--orange:#ff9800;--shadow:0 2px 8px rgba(0,0,0,.15)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--gray);color:var(--dark);font-size:16px;line-height:1.5}
/* LOGIN */
#loginView{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(135deg,var(--pink),var(--pink-dark));color:#fff}
#loginView h1{font-size:1.8rem;margin-bottom:.3rem;text-align:center}
#loginView p{opacity:.8;margin-bottom:2rem}
#loginView form{background:#fff;color:var(--dark);border-radius:16px;padding:2rem 1.5rem;width:90%;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,.3)}
#loginView input{width:100%;padding:14px 12px;margin-bottom:1rem;border:2px solid #e0e0e0;border-radius:10px;font-size:16px}
#loginView input:focus{border-color:var(--pink);outline:none}
#loginView button{width:100%;padding:14px;background:var(--pink);color:#fff;border:none;border-radius:10px;font-size:1.1rem;font-weight:600;cursor:pointer}
#loginView button:active{background:var(--pink-dark)}
.login-error{color:var(--red);text-align:center;margin-top:1rem;font-size:.9rem}
/* HEADER */
header{position:sticky;top:0;z-index:100;background:var(--pink);color:#fff;padding:.6rem 1rem;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
header .title{font-size:1.1rem;font-weight:600}
header .user-info{display:flex;align-items:center;gap:.5rem;font-size:.85rem}
header .btn-logout{background:rgba(255,255,255,.2);border:none;color:#fff;padding:6px 12px;border-radius:8px;font-size:.8rem;cursor:pointer}
/* NAV */
nav{position:sticky;bottom:0;z-index:100;background:#fff;border-top:1px solid #e0e0e0;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;-ms-overflow-style:none;padding:.3rem 0}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;min-width:64px;background:none;border:none;padding:.5rem .3rem;display:flex;flex-direction:column;align-items:center;gap:2px;color:#999;font-size:.65rem;cursor:pointer;white-space:nowrap}
nav button.active{color:var(--pink)}
nav button .nav-icon{font-size:1.4rem}
/* VIEWS */
.view{display:none;padding:1rem;padding-bottom:80px}
.view.active{display:block}
/* SEARCH */
.search-bar{display:flex;gap:.5rem;margin-bottom:1rem}
.search-bar input{flex:1;padding:12px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px}
.search-bar input:focus{border-color:var(--pink);outline:none}
.filter-chips{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.5rem;-webkit-overflow-scrolling:touch}
.chip{white-space:nowrap;padding:6px 14px;border-radius:20px;background:#fff;border:2px solid #e0e0e0;font-size:.85rem;cursor:pointer}
.chip.active{background:var(--pink);color:#fff;border-color:var(--pink)}
/* CONTACT CARDS */
.contact-card{background:#fff;border-radius:12px;padding:1rem;margin-bottom:.8rem;box-shadow:var(--shadow);cursor:pointer;transition:transform .1s}
.contact-card:active{transform:scale(.98)}
.contact-card .cc-top{display:flex;align-items:center;gap:.8rem}
.contact-card .cc-avatar{width:44px;height:44px;border-radius:50%;background:var(--pink-light);display:flex;align-items:center;justify-content:center;font-size:1.2rem;font-weight:700;color:var(--pink);flex-shrink:0}
.contact-card .cc-info{flex:1;min-width:0}
.contact-card .cc-name{font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-card .cc-meta{font-size:.8rem;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-card .cc-qualite{display:inline-block;padding:2px 8px;border-radius:10px;background:var(--pink-light);color:var(--pink);font-size:.75rem;margin-top:.2rem}
/* STAT BOXES (impact) */
.stat-box{display:inline-block;width:45%;margin:1%;padding:1rem;background:var(--pink-light);border-radius:10px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.stat-box .num{font-size:1.8rem;font-weight:bold;color:var(--pink)}
.stat-box .lbl{font-size:.8rem;color:#666}
/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:flex-end;justify-content:center}
.modal-overlay.active{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.modal-handle{width:40px;height:4px;background:#ccc;border-radius:2px;margin:.6rem auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:0 1rem .5rem}
.modal-header h2{font-size:1.2rem}
.modal-close{background:none;border:none;font-size:1.5rem;color:#999;cursor:pointer;padding:0 .5rem}
.modal-body{padding:0 1rem 1rem}
/* FORM */
.form-group{margin-bottom:1rem}
.form-group label{display:block;font-size:.85rem;color:#888;margin-bottom:.3rem;font-weight:500}
.form-group input,.form-group textarea,.form-group select{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px;background:#fff}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--pink);outline:none}
.form-group textarea{resize:vertical;min-height:80px}
/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:12px 20px;border:none;border-radius:10px;font-size:1rem;font-weight:600;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--pink);color:#fff}
.btn-primary:active{background:var(--pink-dark)}
.btn-secondary{background:#e0e0e0;color:var(--dark)}
.btn-danger{background:var(--red);color:#fff}
.btn-green{background:var(--green);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.btn-sm{padding:8px 12px;font-size:.85rem}
.btn-full{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* HISTORY */
.history-list{background:var(--gray);border-radius:10px;padding:.5rem}
.history-entry{padding:.6rem .5rem;border-bottom:1px solid #e0e0e0;font-size:.85rem}
.history-entry:last-child{border-bottom:none}
.history-entry .he-user{font-weight:600;color:var(--pink)}
.history-entry .he-date{color:#888;font-size:.75rem}
.history-entry .he-action{margin-top:.2rem}
.history-entry .he-details{color:#666;font-size:.8rem;margin-top:.2rem}
/* EVENT CARD */
.event-card{background:#fff;border-radius:12px;padding:1rem;margin-bottom:.8rem;box-shadow:var(--shadow)}
.event-card .ec-date{display:inline-block;background:var(--blue);color:#fff;padding:4px 10px;border-radius:8px;font-size:.85rem;font-weight:600;margin-bottom:.5rem}
.event-card .ec-title{font-size:1.05rem;font-weight:600;margin-bottom:.3rem}
.event-card .ec-lieu{font-size:.85rem;color:#888;margin-bottom:.3rem}
.event-card .ec-desc{font-size:.9rem;color:#555}
.event-card .ec-participants{font-size:.8rem;color:var(--blue);margin-top:.5rem}
/* DOC CARD */
.doc-card{background:#fff;border-radius:12px;padding:1rem;margin-bottom:.8rem;box-shadow:var(--shadow);display:flex;align-items:center;gap:.8rem}
.doc-card .dc-icon{font-size:2rem}
.doc-card .dc-info{flex:1;min-width:0}
.doc-card .dc-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.doc-card .dc-meta{font-size:.8rem;color:#888}
/* STATS */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem;margin-bottom:1rem}
.stat-card{background:#fff;border-radius:12px;padding:1rem;text-align:center;box-shadow:var(--shadow)}
.stat-card .sc-num{font-size:2rem;font-weight:700;color:var(--pink)}
.stat-card .sc-label{font-size:.85rem;color:#888}
.stat-bar{background:#fff;border-radius:12px;padding:1rem;box-shadow:var(--shadow);margin-bottom:.8rem}
.stat-bar .sb-row{display:flex;justify-content:space-between;padding:.3rem 0;border-bottom:1px solid #eee;font-size:.9rem}
.stat-bar .sb-row:last-child{border-bottom:none}
/* EMAIL */
.email-recipients{background:var(--pink-light);border-radius:8px;padding:.5rem;margin-bottom:.5rem;font-size:.85rem;display:flex;flex-wrap:wrap;gap:.3rem}
.email-recipient{background:var(--pink);color:#fff;padding:2px 8px;border-radius:10px;font-size:.75rem;display:inline-flex;align-items:center;gap:4px}
.email-recipient .er-remove{cursor:pointer;font-weight:700}
/* FAB */
.fab{position:fixed;bottom:70px;right:16px;width:56px;height:56px;border-radius:50%;background:var(--pink);color:#fff;border:none;font-size:1.8rem;box-shadow:0 4px 12px rgba(233,30,99,.4);cursor:pointer;z-index:90;display:flex;align-items:center;justify-content:center}
.fab:active{transform:scale(.95)}
/* EMPTY STATE */
.empty{text-align:center;padding:3rem 1rem;color:#999}
.empty .empty-icon{font-size:3rem;margin-bottom:1rem;opacity:.3}
/* TOAST */
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 20px;border-radius:20px;font-size:.9rem;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
/* SECTION COLLAPSE */
.section-collapse{cursor:pointer;padding:.8rem 0;border-top:1px solid #eee;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.section-collapse .sc-toggle{font-size:1.2rem;transition:transform .2s}
.section-collapse.collapsed .sc-toggle{transform:rotate(-90deg)}
.section-content{max-height:max-content;transition:max-height .3s;overflow:hidden}
.section-content.collapsed{max-height:0}
/* ADMIN */
.user-row{background:#fff;border-radius:10px;padding:.8rem 1rem;margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:center;box-shadow:var(--shadow)}
.user-row .ur-name{font-weight:600}
.user-row .ur-role{font-size:.8rem;padding:2px 8px;border-radius:8px;background:var(--pink-light);color:var(--pink)}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView">
<h1>&hearts; Les Ami(e)s de Romy</h1>
<p>Gestion de l'association</p>
<form id="loginForm">
<input type="text" id="loginUser" placeholder="Nom d'utilisateur" autocomplete="username" required>
<input type="password" id="loginPass" placeholder="Mot de passe" autocomplete="current-password" required>
<button type="submit">Se connecter</button>
<div class="login-error" id="loginError"></div>
</form>
</div>

<!-- MAIN APP -->
<div id="appView" style="display:none">
<header>
<div class="title">&hearts; Ami(e)s de Romy <span style="font-size:.7rem;opacity:.7">v1.28</span></div>
<div class="user-info">
<span id="userNameDisplay"></span>
<button class="btn-logout" onclick="logout()">Deconnexion</button>
</div>
</header>

<!-- CONTACTS -->
<div class="view active" id="view-contacts">
<div class="search-bar">
<input type="text" id="searchInput" placeholder="Rechercher un contact..." oninput="searchContacts()">
<button class="btn btn-secondary btn-sm" onclick="showImportExcel()" style="white-space:nowrap">&#128202; Excel</button>
<button class="btn btn-secondary btn-sm" onclick="exportExcel()" style="white-space:nowrap">&#128229; Export</button>
</div>
<div class="filter-chips" id="filterChips"></div>
<div id="contactsList"></div>
</div>

<!-- EVENEMENTS -->
<div class="view" id="view-evenements">
<div style="margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:center">
<div style="display:flex;gap:.3rem">
<button class="btn btn-secondary btn-sm" id="evViewList" onclick="setEvView('list')">Liste</button>
<button class="btn btn-secondary btn-sm" id="evViewCal" onclick="setEvView('cal')">Calendrier</button>
</div>
<button class="btn btn-secondary btn-sm" onclick="exportIcs()">&#128197; .ics</button>
</div>
<div id="evenementsList"></div>
<div id="evenementsCal" style="display:none"></div>
</div>

<!-- EMAILING -->
<div class="view" id="view-emailing">
<div style="margin-bottom:1rem">
<label style="font-size:.85rem;color:#888;display:block;margin-bottom:.3rem">Modele predefini (optionnel)</label>
<select id="emailTemplate" onchange="loadTemplate()" style="width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px">
<option value="">-- Aucun / Email libre --</option>
<option value="newsletter">Newsletter</option>
<option value="relance">Relance</option>
<option value="invitation">Invitation evenement</option>
<option value="newsletter_html">Newsletter HTML (mis en forme)</option>
</select>
</div>
<div class="form-group">
<label>Destinataires (emails)</label>
<div class="email-recipients" id="emailRecipients"></div>
<div style="display:flex;gap:.5rem">
<input type="email" id="emailRecipientInput" placeholder="email@exemple.fr" style="flex:1;padding:10px;border:2px solid #e0e0e0;border-radius:10px">
<button class="btn btn-secondary btn-sm" onclick="addRecipient()">Ajouter</button>
</div>
</div>
<div class="form-group">
<label style="font-size:.85rem;color:#888;display:block;margin-bottom:.3rem">Selectionner par groupe</label>
<select id="emailGroupSelect" onchange="selectEmailGroup(this.value)" style="width:100%;padding:10px;border:2px solid #e0e0e0;border-radius:10px;font-size:14px">
<option value="">-- Choisir un groupe --</option>
</select>
</div>
<div class="form-group">
<label style="font-size:.85rem;color:#888;display:block;margin-bottom:.3rem">Ou ajouter un contact individuel</label>
<select id="emailContactSelect" onchange="addContactByEmail(this.value)" style="width:100%;padding:10px;border:2px solid #e0e0e0;border-radius:10px;font-size:14px">
<option value="">-- Choisir un contact --</option>
</select>
</div>
<div class="form-group">
<label>Objet</label>
<input type="text" id="emailSubject" placeholder="Objet de l'email">
</div>
<div class="form-group">
<label>Message</label>
<textarea id="emailBody" rows="8" placeholder="Votre message..."></textarea>
</div>
<div class="form-group">
<label style="display:flex;align-items:center;gap:.5rem;cursor:pointer">
<input type="checkbox" id="emailHtml" style="width:auto"> Envoyer en HTML (mise en formee)
</label>
</div>
<button class="btn btn-primary btn-full" onclick="sendEmail()">Envoyer l'email</button>
</div>

<!-- DOCUMENTS -->
<div class="view" id="view-documents">
<div id="documentsList"></div>
</div>

<!-- COTISATIONS -->
<div class="view" id="view-dashboard">
<div id="dashboardContent"></div>
</div>
<div class="view" id="view-groupes">
<div id="groupesContent"></div>
</div>
<div class="view" id="view-cotisations">
<div style="display:flex;gap:.5rem;margin-bottom:1rem;align-items:center">
<select id="cotAnneeFilter" onchange="loadCotisations()" style="padding:8px;border:2px solid #e0e0e0;border-radius:10px;font-size:14px">
<option value="">Toutes annees</option>
</select>
</div>
<div id="cotisationsList"></div>
</div>

<!-- TACHES -->
<div class="view" id="view-taches">
<div id="tachesList"></div>
</div>

<!-- DONS -->
<div class="view" id="view-dons">
<div id="donsList"></div>
</div>

<!-- STATS -->
<div class="view" id="view-stats">
<div id="statsContent"></div>
</div>

<!-- IMPACT -->
<div class="view" id="view-impact">
<div id="impactContent"></div>
</div>

<!-- CARTOGRAPHIE -->
<div class="view" id="view-carte">
<div style="margin-bottom:.5rem;display:flex;gap:.5rem;align-items:center">
<select id="carteFilterQualite" onchange="loadCarte()" style="padding:8px;border:2px solid #e0e0e0;border-radius:10px;font-size:14px">
<option value="">Toutes qualites</option>
</select>
</div>
<div id="carteContent" style="min-height:400px"></div>
</div>

<!-- ACCOMPAGNEMENTS -->
<div class="view" id="view-accompagnements">
<div style="display:flex;gap:.5rem;margin-bottom:1rem;align-items:center">
<select id="accompFilterStatut" onchange="loadAccompagnements()" style="padding:8px;border:2px solid #e0e0e0;border-radius:10px;font-size:14px">
<option value="">Tous statuts</option>
<option value="actif">Actifs</option>
<option value="clos">Clos</option>
<option value="suspendu">Suspendus</option>
</select>
<button class="btn btn-secondary btn-sm" onclick="openRapport()">Rapport activite</button>
</div>
<div id="accompagnementsList"></div>
</div>

<!-- NOTES DE FRAIS -->
<div class="view" id="view-frais">
<div id="fraisSummary" style="margin-bottom:1rem"></div>
<div id="fraisList"></div>
</div>

<!-- ECHEANCES -->
<div class="view" id="view-echeances">
<div id="echeancesList"></div>
</div>

<!-- REGISTRE APPELS -->
<div class="view" id="view-appels">
<div id="appelsList"></div>
</div>

<!-- VOTES -->
<div class="view" id="view-votes">
<div id="votesList"></div>
</div>

<!-- CHECKLISTS -->
<div class="view" id="view-checklists">
<div id="checklistsList"></div>
</div>

<!-- SONDAGES -->
<div class="view" id="view-sondages">
<div id="sondagesList"></div>
</div>

<!-- COMPTES-RENDUS -->
<div class="view" id="view-crs">
<div id="crsList"></div>
</div>

<!-- SMS / WHATSAPP -->
<div class="view" id="view-sms">
<div id="smsList"></div>
</div>

<!-- PRESSE -->
<div class="view" id="view-presse">
<div style="display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap">
<button class="btn btn-secondary btn-sm" onclick="showPresseTab('contacts')" id="presseTabContacts">Contacts presse</button>
<button class="btn btn-secondary btn-sm" onclick="showPresseTab('releases')" id="presseTabReleases">Communiques</button>
<button class="btn btn-secondary btn-sm" onclick="showPresseTab('couvertures')" id="presseTabCouvertures">Couvertures</button>
</div>
<div id="presseContactsList"></div>
<div id="presseReleasesList" style="display:none"></div>
<div id="presseCouverturesList" style="display:none"></div>
</div>

<!-- MON ESPACE (membre) -->
<div class="view" id="view-mon-espace">
<div id="monEspaceContent"></div>
</div>

<!-- USERS (admin) -->
<div class="view" id="view-users">
<h2 style="margin-bottom:1rem">Utilisateurs</h2>
<div id="usersList"></div>
<button class="btn btn-primary btn-full" style="margin-top:1rem" onclick="showAddUser()">+ Nouvel utilisateur</button>
</div>

<!-- FAB -->
<button class="fab" id="fabBtn" onclick="fabAction()">+</button>

<!-- FEEDBACK BUTTON (fixed bottom-left) -->
<button id="feedbackBtn" onclick="showFeedbackForm()" style="position:fixed;bottom:70px;left:16px;width:44px;height:44px;border-radius:50%;background:var(--blue);color:#fff;border:none;font-size:1.2rem;box-shadow:0 2px 8px rgba(0,0,0,.2);cursor:pointer;z-index:90;display:flex;align-items:center;justify-content:center">&#128172;</button>

<!-- NAV -->
<nav>
<button class="active" data-view="contacts" onclick="showView('contacts')"><span class="nav-icon">&#128100;</span>Contacts</button>
<button data-view="evenements" onclick="showView('evenements')"><span class="nav-icon">&#128197;</span>Evenements</button>
<button data-view="emailing" onclick="showView('emailing')"><span class="nav-icon">&#9993;</span>Email</button>
<button data-view="documents" onclick="showView('documents')"><span class="nav-icon">&#128206;</span>Docs</button>
<button data-view="dashboard" onclick="showView('dashboard')"><span class="nav-icon">&#128202;</span>Dashboard</button>
<button data-view="cotisations" onclick="showView('cotisations')"><span class="nav-icon">&#128176;</span>Cotis.</button>
<button data-view="taches" onclick="showView('taches')"><span class="nav-icon">&#9745;</span>Taches</button>
<button data-view="groupes" onclick="showView('groupes')"><span class="nav-icon">&#128229;</span>Groupes</button>
<button data-view="dons" onclick="showView('dons')"><span class="nav-icon">&#127881;</span>Dons</button>
<button data-view="stats" onclick="showView('stats')"><span class="nav-icon">&#128202;</span>Stats</button>
<button data-view="impact" onclick="showView('impact')"><span class="nav-icon">&#10084;</span>Impact</button>
<button data-view="carte" onclick="showView('carte')"><span class="nav-icon">&#128205;</span>Carte</button>
<button data-view="accompagnements" onclick="showView('accompagnements')"><span class="nav-icon">&#128106;</span>Accomp.</button>
<button data-view="frais" onclick="showView('frais')"><span class="nav-icon">&#128181;</span>Frais</button>
<button data-view="echeances" onclick="showView('echeances')"><span class="nav-icon">&#9203;</span>Echeances</button>
<button data-view="appels" onclick="showView('appels')"><span class="nav-icon">&#128222;</span>Appels</button>
<button data-view="votes" onclick="showView('votes')"><span class="nav-icon">&#127779;</span>Votes</button>
<button data-view="checklists" onclick="showView('checklists')"><span class="nav-icon">&#9989;</span>Checklists</button>
<button data-view="sondages" onclick="showView('sondages')"><span class="nav-icon">&#128202;</span>Sondages</button>

// ===== XSS PROTECTION =====
function esc(s) {
if (!s) return '';
return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ===== AUTH =====
document.getElementById('loginForm').addEventListener('submit', async (e) => {
e.preventDefault();
const username = document.getElementById('loginUser').value.trim();
const password = document.getElementById('loginPass').value;
try {
const res = await fetch('/auth/login', {
method: 'POST',
headers: {'Content-Type': 'application/json'},
body: JSON.stringify({username, password})
});
if (!res.ok) {
const err = await res.json();
throw new Error(err.detail || 'Erreur');
}
const data = await res.json();
token = data.token;
currentUser = data.username;
currentRole = data.role;
window.myContactId = data.contact_id || '';
localStorage.setItem('romy_token', token);
localStorage.setItem('romy_user', currentUser);
localStorage.setItem('romy_role', currentRole);
if (data.contact_id) localStorage.setItem('romy_contact_id', data.contact_id);
showApp();
} catch (e) {
document.getElementById('loginError').textContent = e.message;
}
});

function logout() {
token = '';
currentUser = '';
currentRole = '';
window.myContactId = '';
localStorage.removeItem('romy_token');
localStorage.removeItem('romy_user');
localStorage.removeItem('romy_role');
localStorage.removeItem('romy_contact_id');
location.reload();
}

// ===== API HELPER =====
async function api(url, options = {}) {
const headers = options.headers || {};
if (token) headers['Authorization'] = 'Bearer ' + token;
if (options.body && typeof options.body === 'object') {
headers['Content-Type'] = 'application/json';
options.body = JSON.stringify(options.body);
}
const res = await fetch(url, {...options, headers});
if (res.status === 401) {
logout();
return null;
}
if (!res.ok) {
const err = await res.json().catch(() => ({detail: 'Erreur'}));
throw new Error(err.detail || 'Erreur');
}
return res.json();
}

async function loadDashboard() {
try {
const d = await api('/api/dashboard');
let html = '';

// Activites recentes
html += '<div class="stat-bar"><div style="font-weight:600;margin-bottom:.5rem">Activites recentes (7 derniers jours)</div>';
if (d.activites_recentes && d.activites_recentes.length > 0) {
for (const a of d.activites_recentes.slice(0, 10)) {
const date = a.date ? new Date(a.date).toLocaleDateString('fr-FR') + ' ' + new Date(a.date).toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'}) : '-';
html += '<div class="sb-row"><span><b>' + esc(a.user) + '</b> — ' + esc(a.action) + ' — ' + esc(a.contact) + '</span><span style="color:#888;font-size:.8rem">' + date + '</span></div>';
}
} else {
html += '<div style="color:#999;padding:.5rem">Aucune activite recente</div>';
}
html += '</div>';

// Cotisations en retard
html += '<div class="stat-bar" style="margin-top:.8rem"><div style="font-weight:600;margin-bottom:.5rem">Cotisations en retard (' + new Date().getFullYear() + ')</div>';
if (d.cotisations_retard && d.cotisations_retard.length > 0) {
for (const c of d.cotisations_retard) {
html += '<div class="sb-row"><span style="color:var(--red)">' + esc(c.contact_nom) + ' — ' + esc(c.statut) + '</span><span>' + (c.montant || 0) + ' EUR</span></div>';
}
} else {
html += '<div style="color:var(--green);padding:.5rem">Toutes les cotisations sont a jour</div>';
}
html += '</div>';

// Contacts sans cotisation
html += '<div class="stat-bar" style="margin-top:.8rem"><div style="font-weight:600;margin-bottom:.5rem">Contacts sans cotisation (' + new Date().getFullYear() + '): ' + (d.contacts_sans_cotisation || []).length + '</div>';
if (d.contacts_sans_cotisation && d.contacts_sans_cotisation.length > 0 && d.contacts_sans_cotisation.length <= 10) {
for (const c of d.contacts_sans_cotisation) {
html += '<div class="sb-row"><span>' + esc(c.nom) + ' (' + esc(c.qualite || '-') + ')</span>' + (c.email ? '<span style="color:var(--blue);font-size:.8rem">email OK</span>' : '<span style="color:#999;font-size:.8rem">pas email</span>') + '</div>';

} else if (d.contacts_sans_cotisation && d.contacts_sans_cotisation.length > 10) {
html += '<div style="color:#999;padding:.5rem">' + d.contacts_sans_cotisation.length + ' contacts sans cotisation</div>';
}
html += '</div>';

// Taches a venir
html += '<div class="stat-bar" style="margin-top:.8rem"><div style="font-weight:600;margin-bottom:.5rem">Taches a venir (30 jours)</div>';
if (d.taches_a_venir && d.taches_a_venir.length > 0) {
for (const t of d.taches_a_venir) {
const color = t.jours_restants <= 3 ? 'var(--red)' : (t.jours_restants <= 7 ? 'var(--orange)' : 'var(--blue)');
html += '<div class="sb-row"><span>' + esc(t.titre) + (t.contact_nom ? ' — ' + esc(t.contact_nom) : '') + '</span><span style="color:' + color + '">' + t.jours_restants + 'j</span></div>';
}
} else {
html += '<div style="color:#999;padding:.5rem">Aucune tache a venir</div>';
}
html += '</div>';

// Prochains evenements
html += '<div class="stat-bar" style="margin-top:.8rem"><div style="font-weight:600;margin-bottom:.5rem">Prochains evenements</div>';
if (d.prochains_evenements && d.prochains_evenements.length > 0) {
for (const ev of d.prochains_evenements) {
html += '<div class="sb-row"><span>' + esc(ev.titre) + (ev.lieu ? ' — ' + esc(ev.lieu) : '') + '</span><span style="color:var(--blue)">' + ev.jours_restants + 'j</span></div>';
}
} else {
html += '<div style="color:#999;padding:.5rem">Aucun evenement a venir</div>';
}
html += '</div>';

// Contacts non contactes depuis 90j
html += '<div class="stat-bar" style="margin-top:.8rem"><div style="font-weight:600;margin-bottom:.5rem">Contacts non contactes depuis +90 jours</div>';
if (d.contacts_non_contactes && d.contacts_non_contactes.length > 0) {

html += '<div style="color:var(--green);padding:.5rem">Tous les contacts ont ete contactes recemment</div>';

function showImportExcel() {
document.getElementById('modalTitle').textContent = 'Importer un fichier Excel';
document.getElementById('modalBody').innerHTML = `
<div style="margin-bottom:1rem;padding:.8rem;background:var(--pink-light);border-radius:10px;font-size:.85rem">
Selectionnez un fichier .xlsx. Les colonnes reconnues seront importees automatiquement.
Les doublons (meme nom, telephone ou email) seront ignores.
</div>
<div class="form-group"><label>Fichier Excel (.xlsx)</label><input type="file" id="import-file" accept=".xlsx,.xls"></div>
<button class="btn btn-primary btn-full" onclick="doImportExcel()">Importer</button>
<div id="importResult" style="margin-top:1rem"></div>
`;

async function doImportExcel() {
const fileInput = document.getElementById('import-file');
if (!fileInput.files[0]) {
showToast('Selectionnez un fichier .xlsx');
return;
}
const formData = new FormData();
formData.append('file', fileInput.files[0]);
try {
const headers = {};
if (token) headers['Authorization'] = 'Bearer ' + token;
const res = await fetch('/api/import/excel', {method: 'POST', headers, body: formData});
const data = await res.json();
if (!res.ok) {
throw new Error(data.detail || 'Erreur import');
}
let html = `<div style="padding:1rem;background:#e8f5e9;border-radius:10px;margin-bottom:.5rem">
<div style="font-weight:600;color:var(--green)">Import reussi</div>
<div style="margin-top:.5rem">${data.ajoutes} contact(s) ajoute(s), ${data.doublons_ignores} doublon(s) ignore(s)</div>
</div>`;
if (data.nouveaux && data.nouveaux.length) {
html += '<div style="font-weight:600;margin-bottom:.3rem">Nouveaux contacts :</div>';
for (const n of data.nouveaux) {
html += `<div style="padding:.2rem 0;color:var(--green)">+ ${esc(n)}</div>`;
}
}
if (data.deja_existants && data.deja_existants.length) {
html += '<div style="font-weight:600;margin-top:.5rem;margin-bottom:.3rem">Deja presents :</div>';
for (const d of data.deja_existants) {
html += `<div style="padding:.2rem 0;color:#888">= ${esc(d)}</div>`;
}
}
if (data.colonnes_detectees) {
html += '<div style="margin-top:.5rem;font-size:.8rem;color:#888">Colonnes detectees : ' + Object.entries(data.colonnes_detectees).map(([k,v]) => `${esc(k)} <- ${esc(v)}`).join(', ') + '</div>';
}
document.getElementById('importResult').innerHTML = html;
loadContacts();
showToast(`${data.ajoutes} contact(s) importe(s)`);
} catch (e) {
document.getElementById('importResult').innerHTML = `<div style="padding:1rem;background:#ffebee;border-radius:10px;color:var(--red)">${esc(e.message)}</div>`;
showToast(e.message);
}
}

async function loadContacts() {
try {
allContacts = await api('/api/contacts');
renderContacts();
renderFilterChips();

showToast(e.message);
}

function renderFilterChips() {
const qualites = [...new Set(allContacts.map(c => c.qualite).filter(Boolean))];
const container = document.getElementById('filterChips');
let html = `<button class="chip ${!currentFilter?'active':''}" onclick="setFilter('')">Tous</button>`;
for (const q of qualites) {
html += `<button class="chip ${currentFilter===q?'active':''}" onclick="setFilter('${esc(q)}')">${esc(q)}</button>`;
}
container.innerHTML = html;
}

function setFilter(q) {
currentFilter = q;
renderContacts();
renderFilterChips();
}

function searchContacts() {
renderContacts();
}

function renderContacts() {
const search = document.getElementById('searchInput').value.toLowerCase();
let filtered = allContacts;
if (search) {
filtered = filtered.filter(c =>
(c.prenom + ' ' + c.nom + ' ' + c.email + ' ' + c.telephone + ' ' + c.notes).toLowerCase().includes(search)
);
}
if (currentFilter) {
filtered = filtered.filter(c => c.qualite === currentFilter);
}
if (filtered.length === 0) {
document.getElementById('contactsList').innerHTML = '<div class="empty"><div class="empty-icon">&#128100;</div>Aucun contact</div>';
return;
}
let html = '';
for (const c of filtered) {
const initials = esc((c.prenom[0] || '?') + (c.nom[0] || ''));
html += `<div class="contact-card" onclick="showContactDetail('${c.id}')">
<div class="cc-top">
<div class="cc-avatar">${initials.toUpperCase()}</div>
<div class="cc-info">
<div class="cc-name">${esc(c.prenom)} ${esc(c.nom)}</div>
<div class="cc-meta">${esc(c.telephone || c.email || 'Pas de contact')}</div>
${c.qualite ? `<span class="cc-qualite">${esc(c.qualite)}</span>` : ''}
</div>
</div>
</div>`;
}
document.getElementById('contactsList').innerHTML = html;
}

function formatDate(iso) {
if (!iso) return '-';
const d = new Date(iso);
return d.toLocaleDateString('fr-FR') + ' ' + d.toLocaleTimeString('fr-FR', {hour:'2-digit',minute:'2-digit'});
}

function toggleSection(el) {
el.classList.toggle('collapsed');
const content = el.nextElementSibling;
content.classList.toggle('collapsed');
}

function selectEmailGroup(qualite) {
if (!qualite) return;
const contacts = allContacts;
let selected = [];
if (qualite === '__all__') {
selected = contacts.filter(c => c.email).map(c => c.id);
} else {
selected = contacts.filter(c => c.qualite === qualite && c.email).map(c => c.id);
}
// Add to existing selection (merge, no duplicates)
for (const id of selected) {
if (!emailContactIds.includes(id)) {
emailContactIds.push(id);
}
}
// Reset group dropdown
document.getElementById('emailGroupSelect').value = '';
renderEmailRecipients();
const groupName = qualite === '__all__' ? 'Tous' : qualite;
showToast(selected.length + ' contact(s) ajoute(s) (' + groupName + ')');
}

function addContactByEmail(contactId) {
if (!contactId) return;
if (!emailContactIds.includes(contactId)) {
emailContactIds.push(contactId);
}
document.getElementById('emailContactSelect').value = '';
renderEmailRecipients();
}

emailRecipients.push(email);
renderEmailRecipients();
input.value = '';

function getDocIcon(filename) {
const ext = filename.split('.').pop().toLowerCase();
if (['pdf'].includes(ext)) return '&#128196;';
if (['doc','docx'].includes(ext)) return '&#128209;';
if (['xls','xlsx'].includes(ext)) return '&#128202;';
if (['jpg','jpeg','png','gif'].includes(ext)) return '&#128247;';
if (['mp4','avi','mov'].includes(ext)) return '&#127909;';
return '&#128206;';
}

async function downloadDoc(id) {

if (token) headers['Authorization'] = 'Bearer ' + token;
try {
const res = await fetch(`/api/documents/${id}`, {headers});
const blob = await res.blob();
const url = URL.createObjectURL(blob);
const a = document.createElement('a');
a.href = url;
const cd = res.headers.get('content-disposition') || '';
const match = cd.match(/filename="?(.+)"?/);
a.download = match ? match[1] : 'document';
a.click();
URL.revokeObjectURL(url);
} catch (e) {
showToast('Erreur telechargement');
}
}

let evViewMode = 'list';
let calCurrentMois = 0;

function setEvView(mode) {
evViewMode = mode;
document.getElementById('evenementsList').style.display = mode === 'list' ? 'block' : 'none';
document.getElementById('evenementsCal').style.display = mode === 'cal' ? 'block' : 'none';

document.getElementById('evViewList').style.color = mode === 'list' ? '#fff' : '';

document.getElementById('evViewCal').style.color = mode === 'cal' ? '#fff' : '';

}

async function loadCalendrier() {
try {
const cal = await api('/api/evenements/calendrier?mois=' + calCurrentMois);
const events = cal.events || [];
const moisLabel = cal.mois_label_fr || cal.mois_label || '';
const nbJours = cal.nb_jours || 30;
// jour de la semaine du 1er (0=dimanche)
const [y, m] = cal.mois_cible.split('-').map(Number);
const firstDay = new Date(y, m - 1, 1).getDay();
const offset = firstDay === 0 ? 6 : firstDay - 1; // lundi=0

let html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">';
html += '<button class="btn btn-secondary btn-sm" onclick="calCurrentMois--; loadCalendrier()">&lt;</button>';
html += '<div style="font-weight:600;text-transform:capitalize">' + esc(moisLabel) + '</div>';
html += '<button class="btn btn-secondary btn-sm" onclick="calCurrentMois++; loadCalendrier()">&gt;</button>';
html += '</div>';

// Grille calendrier
html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:.7rem;text-align:center;color:#999;margin-bottom:2px">';
for (const j of ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim']) {
html += '<div>' + j + '</div>';
}
html += '</div>';
html += '<div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px">';
// Cellules vides
for (let i = 0; i < offset; i++) {
html += '<div style="min-height:50px;background:#f0f0f0;border-radius:4px"></div>';
}
// Jours
const eventsByDay = {};
for (const ev of events) {
const d = ev.jour;
if (!eventsByDay[d]) eventsByDay[d] = [];
eventsByDay[d].push(ev);
}
const today = new Date();
const isCurrentMonth = calCurrentMois === 0;
for (let d = 1; d <= nbJours; d++) {
const dayEvents = eventsByDay[d] || [];
const isToday = isCurrentMonth && d === today.getDate();
let cellBg = '#fff';
let cellBorder = '1px solid #eee';
if (isToday) { cellBg = '#f3e0f5'; cellBorder = '2px solid var(--pink)'; }
let cellHtml = '<div style="min-height:50px;background:' + cellBg + ';border:' + cellBorder + ';border-radius:4px;padding:2px;overflow:hidden">';
cellHtml += '<div style="font-size:.7rem;color:#888">' + d + '</div>';
for (const ev of dayEvents) {
cellHtml += '<div style="font-size:.65rem;background:var(--blue);color:#fff;border-radius:3px;padding:1px 3px;margin-top:2px;cursor:pointer" onclick="showEvenementForm(\'' + ev.id + '\')">' + esc(ev.titre) + '</div>';
}
cellHtml += '</div>';
html += cellHtml;
}
html += '</div>';

if (events.length === 0) {
html += '<div style="text-align:center;color:#999;padding:1rem;font-size:.85rem">Aucun evenement ce mois-ci</div>';
}

document.getElementById('evenementsCal').innerHTML = html;
} catch (e) { showToast(e.message); }
}

const tags = adv.tags_count || {};
if (Object.keys(tags).length > 0) {
html += '<div class="stat-bar"><div style="font-weight:600;margin-bottom:.5rem">Repartition par tags</div>';

}

// ===== PRESENCE (dans evenements) =====
function renderMemberPresence(ev) {
// For members: show a simple "Je viens" / "Je ne viens pas" button
// Uses the member's contact_id from auth config
// We need to know the member's contact_id — we'll get it from /auth/verify
const myContactId = window.myContactId || '';
if (!myContactId) {
return '<div style="font-size:.8rem;color:#999;margin-top:.5rem;padding:.5rem;background:#f5f5f5;border-radius:8px">Contactez un referent pour etre ajoute aux participants.</div>';
}
const presence = ev.presence || {};
const myStatus = presence[myContactId] || '';
const statusLabel = myStatus === 'present' ? 'Present' : (myStatus === 'absent' ? 'Absent' : (myStatus === 'excuse' ? 'Excuse' : '--'));
const statusColor = myStatus === 'present' ? 'var(--green)' : (myStatus === 'absent' ? 'var(--red)' : (myStatus === 'excuse' ? 'var(--orange)' : '#999'));
return `<div style="margin-top:.5rem;padding:.75rem;background:var(--pink-light);border-radius:10px">
<div style="font-size:.85rem;margin-bottom:.5rem">Ma presence: <strong style="color:${statusColor}">${statusLabel}</strong></div>
<div style="display:flex;gap:.5rem;flex-wrap:wrap">
<button class="btn btn-green btn-sm ${myStatus==='present'?'active':''}" onclick="setMyPresence('${ev.id}','present')">Je viens !</button>
<button class="btn btn-sm" style="background:#fff;color:var(--orange);border:1px solid var(--orange)" onclick="setMyPresence('${ev.id}','excuse')">Excuse(e)</button>
<button class="btn btn-sm" style="background:#fff;color:var(--red);border:1px solid var(--red)" onclick="setMyPresence('${ev.id}','absent')">Absent(e)</button>
</div>
</div>`;
}

async function setMyPresence(evtId, status) {
try {
const contactId = window.myContactId || '';
if (!contactId) { showToast('Aucun contact associe a votre compte'); return; }
await api(`/api/evenements/${evtId}/presence`, {method: 'POST', body: {contact_id: contactId, presence: status}});
showToast('Presence enregistree !');
loadEvenements();
} catch (e) { showToast(e.message); }
}

function renderPresenceSection(ev) {
if (!ev.participants || ev.participants.length === 0) return '';
const presence = ev.presence || {};
let rows = '';
for (const pid of ev.participants) {
const c = allContacts.find(x => x.id === pid);
const name = c ? esc(c.prenom + ' ' + c.nom) : pid;
const status = presence[pid] || '';
rows += `<div style="display:flex;align-items:center;gap:.5rem;padding:.3rem 0;border-bottom:1px solid #eee">
<span style="flex:1;font-size:.85rem">${name}</span>
<select style="padding:4px 8px;border:1px solid #e0e0e0;border-radius:6px;font-size:.8rem" onchange="updatePresence('${ev.id}','${pid}',this.value)">
<option value="" ${status===''?'selected':''}>--</option>
<option value="present" ${status==='present'?'selected':''}>Present</option>
<option value="absent" ${status==='absent'?'selected':''}>Absent</option>
<option value="excuse" ${status==='excuse'?'selected':''}>Excuse</option>
</select>
</div>`;
}
return `<div class="section-collapse" onclick="toggleSection(this)">Presence <span class="sc-toggle">&#8964;</span></div>
<div class="section-content collapsed"><div style="padding:.5rem 0">${rows}</div></div>`;
}

async function updatePresence(evtId, contactId, status) {
try {
const events = await api('/api/evenements');
const ev = events.find(e => e.id === evtId);
if (!ev) return;
const presence = ev.presence || {};
presence[contactId] = status;
await api(`/api/evenements/${evtId}`, {method: 'PUT', body: {presence}});
} catch (e) { showToast(e.message); }
}

// ===== NOTIFICATIONS PUSH (PWA) =====
function setupPushNotifications() {
if (!('Notification' in window)) { return; }
if (Notification.permission === 'granted') { return; }
if (Notification.permission !== 'denied') {
// Demander la permission au chargement
setTimeout(() => {
Notification.requestPermission().then(permission => {
if (permission === 'granted') {
new Notification('CRM Romy', {body: 'Notifications activees', icon: 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>&hearts;</text></svg>'});
}
});
}, 3000);
}
}

html += '<h3>Contacts par qualite</h3><div style="margin-bottom:1rem">';
const maxQ = Math.max(...Object.values(d.contacts_par_qualite), 1);
for (const [q, n] of Object.entries(d.contacts_par_qualite)) {

html += `<div style="margin-bottom:.3rem"><span style="font-size:.8rem;display:inline-block;width:120px">${esc(q)}</span><div style="display:inline-block;height:20px;background:var(--pink);border-radius:4px;width:${pct}%;min-width:${n*3}px;vertical-align:middle"></div> <span style="font-size:.8rem;font-weight:bold">${n}</span></div>`;
}
html += '</div>';
// Dons par mois
html += '<h3>Dons par mois</h3><div style="margin-bottom:1rem">';
const mois = Object.keys(d.dons_par_mois).sort();
const maxD = Math.max(...Object.values(d.dons_par_mois), 1);
for (const m of mois.slice(-12)) {
const v = d.dons_par_mois[m];
const pct = (v / maxD * 100).toFixed(0);
html += `<div style="margin-bottom:.2rem"><span style="font-size:.75rem;display:inline-block;width:80px">${esc(m)}</span><div style="display:inline-block;height:16px;background:var(--green);border-radius:4px;width:${pct}%;min-width:${v/5}px;vertical-align:middle"></div> <span style="font-size:.75rem;font-weight:bold">${v} eur</span></div>`;
}
html += '</div>';
// Cotisations par annee
html += '<h3>Cotisations par annee</h3><div>';
for (const [an, v] of Object.entries(d.cots_par_annee).sort().reverse()) {
html += `<div style="margin-bottom:.2rem"><span style="font-size:.8rem;display:inline-block;width:80px">${esc(an)}</span><div style="display:inline-block;height:16px;background:var(--blue);border-radius:4px;width:${v/2}px;vertical-align:middle"></div> <span style="font-size:.8rem;font-weight:bold">${v} eur</span></div>`;
}
html += '</div>';
document.getElementById('impactContent').innerHTML = html;
} catch (e) { showToast(e.message); }
}

async function loadCarte() {
try {
const d = await api('/api/cartographie');
const filterQ = document.getElementById('carteFilterQualite').value;
let points = d.points;
// Populate filter if empty
const sel = document.getElementById('carteFilterQualite');
if (sel.children.length <= 1) {
const qualites = [...new Set(d.points.map(p => p.qualite).filter(Boolean))].sort();
for (const q of qualites) {
sel.appendChild(new Option(q, q));
}
}
if (filterQ) points = points.filter(p => p.qualite === filterQ);
// Simple list-based display (no Leaflet to keep it lightweight)
let html = `<div style="margin-bottom:.5rem;font-size:.85rem;color:#888">${points.length} contacts localises</div>`;
// Group by code postal
const byCp = {};
for (const p of points) {
const cp = p.code_postal || '---';
if (!byCp[cp]) byCp[cp] = [];
byCp[cp].push(p);
}
const sortedCps = Object.keys(byCp).sort();
for (const cp of sortedCps) {
const dept = cp.substring(0, 2);
html += `<div style="margin-bottom:.8rem;padding:.6rem;background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.1)">`;
html += `<div style="font-weight:bold;color:var(--pink);font-size:.9rem;margin-bottom:.3rem">${cp} ${byCp[cp][0].ville || ''}</div>`;
for (const p of byCp[cp]) {
html += `<div style="font-size:.8rem;padding:.2rem 0"><span style="font-weight:600">${esc(p.nom)}</span> ${p.qualite ? '<span style="color:var(--pink)">'+esc(p.qualite)+'</span>' : ''} ${p.telephone ? ' &middot; '+esc(p.telephone) : ''}</div>`;
}
html += '</div>';
}
document.getElementById('carteContent').innerHTML = html;
} catch (e) { showToast(e.message); }
}

<span style="font-size:.8rem;font-weight:bold;color:var(--pink)">${count} (${pct}%)</span>
${isOpen ? '</label>' : '</div>'}
<div style="height:4px;background:#eee;border-radius:2px;margin-top:.2rem"><div style="height:4px;background:var(--pink);border-radius:2px;width:${pct}%"></div></div>
</div>`;
}
html += `<div style="display:flex;gap:.5rem;margin-top:.5rem">`;
if (currentRole !== 'membre' && isOpen) html += `<button class="btn btn-secondary btn-sm" onclick="cloturerSondage('${s.id}')">Cloturer</button>`;
if (currentRole !== 'membre') html += `<button class="btn btn-danger btn-sm" onclick="deleteSondage('${s.id}')">Supprimer</button>`;
html += `</div>`;
}
html += `</div>`;
}
document.getElementById('sondagesList').innerHTML = html;
} catch (e) { showToast(e.message); }
}

// ===== F15: MON ESPACE =====
async function loadMonEspace() {
try {
const d = await api('/api/mon-profil');
const c = d.contact || {};
let html = '<h2 style="margin-bottom:1rem">Mon espace</h2>';
// Profile
html += `<div class="contact-card" style="margin-bottom:1rem">
<div class="cc-top"><div class="cc-info">
<div class="cc-name">${esc(c.prenom||'')} ${esc(c.nom||'')}</div>
<div class="cc-meta">${esc(c.qualite||'-')}</div>
</div></div>
<div style="padding:.5rem 0;font-size:.85rem">
<div style="margin-bottom:.3rem"><strong>Email:</strong> ${esc(c.email||'-')}</div>
<div style="margin-bottom:.3rem"><strong>Telephone:</strong> ${esc(c.telephone||'-')}</div>
<div style="margin-bottom:.3rem"><strong>Ville:</strong> ${esc(c.ville||'-')} ${esc(c.code_postal||'')}</div>
</div>
<button class="btn btn-primary btn-sm" onclick="editMonProfil()">Modifier mes infos</button>
</div>`;
// Cotisations
if (d.cotisations && d.cotisations.length > 0) {
html += '<h3>Mes cotisations</h3>';
for (const ct of d.cotisations) {
const sc = ct.statut === 'paye' ? 'var(--green)' : 'var(--orange)';
html += `<div style="padding:.4rem 0;border-bottom:1px solid #eee"><strong>${esc(ct.annee||'-')}</strong> ${ct.montant} eur <span style="background:${sc};color:#fff;padding:1px 6px;border-radius:8px;font-size:.7rem">${esc(ct.statut||'-')}</span></div>`;
}
}
// Evenements
if (d.events_inscrits && d.events_inscrits.length > 0) {
html += '<h3 style="margin-top:1rem">Mes evenements</h3>';
for (const e of d.events_inscrits) {
const pc = e.presence === 'present' ? 'var(--green)' : (e.presence === 'excuse' ? 'var(--orange)' : '#999');
html += `<div style="padding:.4rem 0;border-bottom:1px solid #eee"><strong>${esc(e.date||'-')}</strong> ${esc(e.titre||'')} <span style="background:${pc};color:#fff;padding:1px 6px;border-radius:8px;font-size:.7rem">${esc(e.presence)}</span></div>`;
}
}
document.getElementById('monEspaceContent').innerHTML = html;
} catch (e) {
document.getElementById('monEspaceContent').innerHTML = '<div class="empty">Aucun profil associe a votre compte. Contactez un administrateur.</div>';
}
}

function editMonProfil() {
api('/api/mon-profil').then(d => {
const c = d.contact || {};
document.getElementById('modalTitle').textContent = 'Modifier mes informations';
document.getElementById('modalBody').innerHTML = `
<div class="form-group"><label>Email</label><input type="email" id="mp-email" value="${esc(c.email||'')}"></div>
<div class="form-group"><label>Telephone</label><input type="tel" id="mp-tel" value="${esc(c.telephone||'')}"></div>
<div class="form-group"><label>Ville</label><input type="text" id="mp-ville" value="${esc(c.ville||'')}"></div>
<div class="form-group"><label>Code postal</label><input type="text" id="mp-cp" value="${esc(c.code_postal||'')}"></div>
<button class="btn btn-primary btn-full" onclick="saveMonProfil()">Enregistrer</button>`;
openModal();
}).catch(e => showToast(e.message));
}

async function saveMonProfil() {
const body = {
email: document.getElementById('mp-email').value,
telephone: document.getElementById('mp-tel').value,
ville: document.getElementById('mp-ville').value,
code_postal: document.getElementById('mp-cp').value
};
try { await api('/api/mon-profil', {method:'PUT', body}); closeModal(); loadMonEspace(); showToast('Profil mis a jour'); } catch(e){ showToast(e.message); }
}

// ===== TOAST =====
let toastTimer;
function showToast(msg) {
const t = document.getElementById('toast');
t.textContent = msg;
t.classList.add('show');
clearTimeout(toastTimer);
toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// ===== INIT =====
if (token) {
// Verify token
fetch('/auth/verify?token=' + token)
.then(r => { if (r.ok) return r.json(); throw new Error('invalid'); })
.then(data => {
currentUser = data.username;
currentRole = data.role;
localStorage.setItem('romy_user', currentUser);
localStorage.setItem('romy_role', currentRole);
showApp();
})
.catch(() => {
token = '';
localStorage.removeItem('romy_token');
});
}
</script>
